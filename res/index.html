<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* ====== 全局 ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ====== 标题栏 ====== */
    .titlebar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .titlebar h1 { font-size: 16px; font-weight: 600; }
    .titlebar .ver { font-size: 11px; opacity: 0.6; }

    /* ====== 主体双栏 ====== */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ====== 左侧面板 ====== */
    .left-panel {
      flex: 1.3;
      padding: 12px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title .badge { font-size: 11px; color: #999; }

    /* 表格容器 */
    .table-wrap {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 8px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      background: #fff;
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .table-wrap thead th {
      background: #fafafa;
      color: #888;
      font-weight: 500;
      font-size: 10px;
      text-transform: uppercase;
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .table-wrap thead th.right { text-align: right; }
    .table-wrap tbody td {
      padding: 7px 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .table-wrap tbody tr:nth-child(even) { background: #fafbfc; }
    .table-wrap tbody tr:hover { background: #eef1ff; }
    .table-wrap tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
    .table-wrap tbody td.center { text-align: center; }

    .empty-row td {
      padding: 40px;
      text-align: center;
      color: #bbb;
    }

    /* 删除按钮 */
    .btn-del {
      cursor: pointer;
      color: #999;
      font-size: 14px;
      transition: color 0.15s;
    }
    .btn-del:hover { color: #e74c3c; }

    /* 汇总条 */
    .summary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      margin-bottom: 6px;
    }
    .summary-item {
      flex: 1;
      text-align: center;
      color: #fff;
    }
    .summary-item .label {
      font-size: 10px;
      opacity: 0.65;
    }
    .summary-item .value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .summary-item .hint {
      font-size: 9px;
      opacity: 0.5;
    }
    .summary-divider {
      border-left: 1px solid rgba(255,255,255,0.15);
    }

    .btn-clear {
      width: 100%;
      padding: 7px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-clear:hover { border-color: #e74c3c; color: #e74c3c; }
    .btn-clear:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ====== 右侧面板 ====== */
    .right-panel {
      flex: 0.95;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .link {
      font-size: 11px;
      color: #667eea;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 输入框行 */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .input-field {
      flex: 1;
    }
    .input-field label {
      display: block;
      font-size: 10px;
      color: #888;
      margin-bottom: 2px;
    }
    .input-field input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-field input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
    }
    .input-field input.error {
      border-color: #e74c3c;
    }
    .hint-text {
      font-size: 9px;
      color: #aaa;
      margin-top: 4px;
    }

    /* 实时预览 */
    .preview {
      margin-top: 8px;
      padding: 7px 10px;
      background: #f0f2ff;
      border-radius: 6px;
      font-size: 11px;
      color: #555;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview b { color: #333; }

    /* 添加按钮 */
    .btn-add {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.9; }
    .btn-add:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- 标题栏 -->
<div class="titlebar">
  <h1>📦 快递体积重计算器</h1>
  <span class="ver">v1.0</span>
</div>

<!-- 主体双栏 -->
<div class="main">
  <!-- ====== 左侧：包裹清单 ====== -->
  <div class="left-panel">
    <div class="section-title">
      <span>📋 包裹清单</span>
      <span class="badge">共 <b id="pkgCount">0</b> 件</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>尺寸 (cm)</th>
            <th class="right">体积 cm³</th>
            <th class="right">申通</th>
            <th class="right">百世</th>
            <th class="center" style="width:32px;"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="6">暂无包裹</td></tr>
        </tbody>
      </table>
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="label">申通快递</div>
        <div class="value" id="totalSto">0 kg</div>
        <div class="hint">系数 8000</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="label">百世快运</div>
        <div class="value" id="totalBs">0 kg</div>
        <div class="hint">系数 5000</div>
      </div>
    </div>

    <button class="btn-clear" id="btnClear" disabled>清空全部包裹</button>
  </div>

  <!-- ====== 右侧：录入面板 ====== -->
  <div class="right-panel">
    <!-- 收件地址 -->
    <div class="card">
      <div class="card-title">📍 收件地址</div>
      <input type="text" id="destAddr" placeholder="省份 城市 区县" style="width:100%;padding:7px 9px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;outline:none;">
    </div>

    <!-- 包裹录入 -->
    <div class="card">
      <div class="card-title">
        <span>📝 包裹尺寸</span>
        <span class="link" id="toggleMode">切换为体积输入</span>
      </div>

      <!-- 长宽高输入（默认模式） -->
      <div id="dimInputs">
        <div class="input-row">
          <div class="input-field">
            <label>长 (cm)</label>
            <input type="text" id="dimLength" value="" style="width: 100%;">
          </div>
          <div class="input-field">
            <label>宽 (cm)</label>
            <input type="text" id="dimWidth" value="" style="width: 100%;">
          </div>
        </div>
        <div class="input-row">
          <div class="input-field">
            <label>高 (cm)</label>
            <input type="text" id="dimHeight" value="" style="width: 100%;">
          </div>
          <div class="input-field">
            <label>件数</label>
            <input type="text" id="dimQty" value="1" style="width: 100%;">
          </div>
        </div>
      </div>

      <!-- 体积直接输入（隐藏） -->
      <div id="volInputs" style="display:none;">
        <div class="input-row">
          <div class="input-field">
            <label>体积 (cm³)</label>
            <input type="text" id="volVolume" value="" style="width: 100%;">
          </div>
          <div class="input-field">
            <label>件数</label>
            <input type="text" id="volQty" value="1" style="width: 100%;">
          </div>
        </div>
      </div>

      <div class="hint-text">⏎ Enter 跳转 ｜ 聚焦全选 ｜ 件数处回车添加</div>

      <!-- 实时预览 -->
      <div class="preview" id="preview">
        体积 <b>—</b> cm³ ｜ 申通 <b>—</b> kg ｜ 百世 <b>—</b> kg
      </div>

      <button class="btn-add" id="btnAdd" disabled>+ 添加包裹</button>
    </div>
  </div>
</div>

<script type="text/tiscript">
  // ====== 状态 ======
  var isDirectMode = false;  // false=长宽高, true=直接体积

  // ====== UI 元素引用 ======
  function $(sel) { return self.select(sel); }


  // ====== 初始化 ======
  function init() {
    // 聚焦全选：任何输入框获焦时全选
    self.on("focusin", "input[type='text']", function(evt) {
      var el = evt.target;
      self.timer(10, function() { el.selectAll(); });
    });

    // Enter 键行为
    self.on("keydown", "input", function(evt) {
      if (evt.keyCode != 0x0D) return; // 非 Enter
      evt.preventDefault();

      var id = evt.target.id;
      if (id == "dimLength") {
        $(#dimWidth).state.focus = true;
      } else if (id == "dimWidth") {
        $(#dimHeight).state.focus = true;
      } else if (id == "dimHeight") {
        $(#dimQty).state.focus = true;
      } else if (id == "dimQty") {
        doAddPackage();
      } else if (id == "volVolume") {
        $(#volQty).state.focus = true;
      } else if (id == "volQty") {
        doAddPackage();
      }
    });

    // 输入框内容变化 → 实时预览 + 验证按钮状态
    $(#dimLength).on("input", updatePreview);
    $(#dimWidth).on("input", updatePreview);
    $(#dimHeight).on("input", updatePreview);
    $(#dimQty).on("input", updatePreview);
    $(#volVolume).on("input", updatePreview);
    $(#volQty).on("input", updatePreview);

    // 模式切换
    $(#toggleMode).on("click", toggleInputMode);

    // 添加按钮
    $(#btnAdd).on("click", doAddPackage);

    // 清空按钮
    $(#btnClear).on("click", doClearPackages);

    updatePreview();
  }

  // ====== 模式切换 ======
  function toggleInputMode() {
    isDirectMode = !isDirectMode;
    if (isDirectMode) {
      $(#dimInputs).style.display = "none";
      $(#volInputs).style.display = "block";
      $(#toggleMode).text = "切换为长宽高输入";
      $(#volVolume).state.focus = true;
    } else {
      $(#dimInputs).style.display = "block";
      $(#volInputs).style.display = "none";
      $(#toggleMode).text = "切换为体积输入";
      $(#dimLength).state.focus = true;
    }
    updatePreview();
  }

  // ====== 读取当前输入值 ======
  function getInputValues() {
    var l=0, w=0, h=0, vol=0, qty=1;

    if (isDirectMode) {
      var vs = parseFloat($(#volVolume).value);
      vol = vs || 0;
      qty = parseInt($(#volQty).value) || 1;
      if (qty < 1) qty = 1;
    } else {
      l = parseFloat($(#dimLength).value) || 0;
      w = parseFloat($(#dimWidth).value) || 0;
      h = parseFloat($(#dimHeight).value) || 0;
      qty = parseInt($(#dimQty).value) || 1;
      if (qty < 1) qty = 1;
      vol = l * w * h;
    }
    return { length: l, width: w, height: h, volume: vol, quantity: qty, isDirect: isDirectMode };
  }

  // ====== 实时预览 ======
  function updatePreview() {
    var v = getInputValues();

    // 本地计算预览（避免频繁调 Go）
    var volume = v.volume;
    var sto = volume > 0 ? Math.ceil(volume / 8000) : 0;
    var bs  = volume > 0 ? Math.ceil(volume / 5000) : 0;

    // 格式化体积显示
    var volText = volume > 0 ? volume.toLocaleString() + " cm³" : "— cm³";
    var stoText = volume > 0 ? sto + " kg" : "— kg";
    var bsText  = volume > 0 ? bs + " kg" : "— kg";

    $(#preview).html = "体积 <b>" + volText + "</b> ｜ 申通 <b>" + stoText + "</b> ｜ 百世 <b>" + bsText + "</b>";

    // 验证按钮
    var valid = false;
    if (isDirectMode) {
      var qtyRaw = parseInt($(#volQty).value);
      valid = volume > 0 && !isNaN(qtyRaw) && qtyRaw >= 1;
      if (parseFloat($(#volVolume).value) != "" && !valid) {
        $(#volVolume).setAttribute("class", "error");
      } else {
        $(#volVolume).removeAttribute("class");
      }
    } else {
      var lv = parseFloat($(#dimLength).value) || 0;
      var wv = parseFloat($(#dimWidth).value) || 0;
      var hv = parseFloat($(#dimHeight).value) || 0;
      var qtyRaw = parseInt($(#dimQty).value);
      valid = lv > 0 && wv > 0 && hv > 0 && !isNaN(qtyRaw) && qtyRaw >= 1;
      if ($(#dimLength).value != "" && lv <= 0) {
        $(#dimLength).setAttribute("class", "error");
      } else {
        $(#dimLength).removeAttribute("class");
      }
      if ($(#dimWidth).value != "" && wv <= 0) {
        $(#dimWidth).setAttribute("class", "error");
      } else {
        $(#dimWidth).removeAttribute("class");
      }
      if ($(#dimHeight).value != "" && hv <= 0) {
        $(#dimHeight).setAttribute("class", "error");
      } else {
        $(#dimHeight).removeAttribute("class");
      }
    }

    // Clear qty error once input becomes valid
    var qtyErr;
    if (isDirectMode) {
      qtyErr = parseInt($(#volQty).value);
      if (!isNaN(qtyErr) && qtyErr >= 1) {
        $(#volQty).removeAttribute("class");
      }
    } else {
      qtyErr = parseInt($(#dimQty).value);
      if (!isNaN(qtyErr) && qtyErr >= 1) {
        $(#dimQty).removeAttribute("class");
      }
    }

    $(#btnAdd).state.disabled = !valid;
  }

  // ====== 添加包裹 ======
  function doAddPackage() {
    // 先校验件数
    var qtyRaw;
    if (isDirectMode) {
      qtyRaw = parseInt($(#volQty).value);
    } else {
      qtyRaw = parseInt($(#dimQty).value);
    }
    if (isNaN(qtyRaw) || qtyRaw < 1) {
      if (isDirectMode) {
        $(#volQty).setAttribute("class", "error");
      } else {
        $(#dimQty).setAttribute("class", "error");
      }
      return;
    }

    var v = getInputValues();
    v.quantity = qtyRaw;  // 用校验过的值覆盖 getInputValues 的归一化结果

    var valid = false;
    if (isDirectMode) {
      valid = v.volume > 0;
    } else {
      valid = v.length > 0 && v.width > 0 && v.height > 0;
    }
    if (!valid) return;

    var isDirInt = v.isDirect ? 1 : 0;
    var result = view.addPackage(v.length, v.width, v.height, v.volume, isDirInt, v.quantity);

    renderPackageList(result);

    // 清空输入框
    if (isDirectMode) {
      $(#volVolume).value = "";
      $(#volQty).value = "1";
      $(#volVolume).state.focus = true;
    } else {
      $(#dimLength).value = "";
      $(#dimWidth).value = "";
      $(#dimHeight).value = "";
      $(#dimQty).value = "1";
      $(#dimLength).state.focus = true;
    }
    $(#dimQty).removeAttribute("class");
    $(#volQty).removeAttribute("class");
    updatePreview();
  }

  // ====== 删除包裹 ======
  function doDeletePackage(id) {
    var result = view.deletePackage(id);
    renderPackageList(result);
  }

  // ====== 清空包裹 ======
  function doClearPackages() {
    var result = view.clearPackages();
    renderPackageList(result);
  }

  // ====== 渲染包裹列表 ======
  function renderPackageList(result) {
    var pkgs = result.packages;
    var totalSto = result.totalSto;
    var totalBs = result.totalBs;
    var count = result.count;

    if (pkgs.length == 0) {
      $(#tableBody).html = "<tr class='empty-row'><td colspan='6'>暂无包裹</td></tr>";
    } else {
      var html = "";
      for (var i = 0; i < pkgs.length; i++) {
        var p = pkgs[i];

        // 尺寸描述
        var dimDesc;
        if (p.isDirectVol) {
          dimDesc = "直接输入";
        } else {
          dimDesc = p.length + "×" + p.width + "×" + p.height;
        }
        if (p.quantity > 1) {
          dimDesc = dimDesc + " ×" + p.quantity + "件";
        }

        // 体积格式化
        var volFmt = p.volume.toLocaleString();

        // 重量列
        var stoCell = p.stoWeight + " kg";
        if (p.quantity > 1) stoCell = stoCell + " ×" + p.quantity;
        var bsCell = p.bsWeight + " kg";
        if (p.quantity > 1) bsCell = bsCell + " ×" + p.quantity;

        html += "<tr>";
        html += "<td>" + p.id + "</td>";
        html += "<td>" + dimDesc + "</td>";
        html += "<td class='right'>" + volFmt + "</td>";
        html += "<td class='right'><b>" + stoCell + "</b></td>";
        html += "<td class='right'><b>" + bsCell + "</b></td>";
        html += "<td class='center'><span class='btn-del' onclick='doDeletePackage(" + p.id + ")'>×</span></td>";
        html += "</tr>";
      }
      $(#tableBody).html = html;
    }

    $(#totalSto).text = totalSto + " kg";
    $(#totalBs).text = totalBs + " kg";
    $(#pkgCount).text = count;
    $(#btnClear).state.disabled = (count == 0);
  }

  // 启动
  init();
</script>

</body>
</html>
